<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>You're booked · Stack360</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="../stack360-logo.jpg">
<style>
  :root{--ink:#14161a;--ink-2:#4b5160;--ink-3:#8a90a0;--line:#e7e8ec;--bg:#f6f6f4;--accent:#e07830;--accent-w:#fdf1e8}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .bar{display:flex;align-items:center;gap:10px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line)}
  .bar img{width:30px;height:30px} .bar b{font-size:16px;letter-spacing:-.01em}
  .wrap{max-width:1040px;margin:0 auto;padding:32px 20px 48px;display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:32px;align-items:start}
  h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance} p{margin:0 0 12px;color:var(--ink-2)}
  .pill{display:inline-block;font-size:12.5px;font-weight:600;color:#9a4a12;background:var(--accent-w);border-radius:999px;padding:3px 10px;margin-bottom:14px}
  .points{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
  .points li{display:flex;gap:10px} .points li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--accent);margin-top:8px}
  .cal{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:700px}
  .cal .calendly-inline-widget{min-width:320px;height:700px}
  .alt{font-size:13px;color:var(--ink-3);margin-top:18px} .alt a{color:var(--ink-2)}
  @media (max-width:820px){.wrap{grid-template-columns:1fr;gap:20px;padding:22px 16px 40px} h1{font-size:24px} .cal{min-height:640px} .cal .calendly-inline-widget{height:1000px}}
</style></head><body>
<header class="bar"><img src="../stack360-logo.jpg" alt=""><b>Stack360</b></header>
<main class="wrap" style="grid-template-columns:1fr;max-width:640px">
  <section>
    <span class="pill">Booked</span>
    <h1>You're booked for 20 minutes</h1>
    <p>A calendar invite with the meeting link is on its way to your inbox. If something comes up, the invite has a link to reschedule.</p>
    <p class="alt">Questions before then? <a href="mailto:sales@stack360.co">sales@stack360.co</a></p>
  </section>
</main></body></html>
